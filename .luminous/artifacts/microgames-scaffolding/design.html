/*$vite$:1*/</style></head><body><div id="app"></div><script id="portable-data" type="application/json">{"format":"portable-versions-1","versions":[{"version":1,"label":"Python microgames scaffolding","createdAt":"2026-11-15T23:25:51.267Z","digest":"65e6ec79b08e9b777612fb98afcda61aa297f809dd911ab61b4a9c32ca937be6","customCss":"","artifact":{"title":"Python microgames scaffolding","sourceFilename":"design.md","sourceMarkdown":"# Python microgames: one round contract, many small skills\n\nThis is a design proposal, not implemented scaffolding. Today, two generators live in `web/src/lib/microgames.ts`; the editor/controller is in `Microgames.astro`, URL validation is in `microgame-config.ts`, and execution/checking use `microgame-runner.ts` and `public/microgame-checker.py`.\n\nThe organizing idea: **a game definition generates a round; a round describes a document with fixed and editable segments; the editor renders that document; the runner executes its complete text and checks the outcome.** A fill-in-the-blank and a blank-page exercise use the same document contract.\n\n```portable-model\nversion: 1\nrecipe: architecture\nvocabulary:\n  definition:\n    label: Trusted game definition\n  module:\n    label: Executing module\n  data:\n    label: Data contract\npresentation:\n  definition: definition\n  module: module\n  data: data\n```\n\n## From URL to a generated round\n\nA category is for organizing the catalog, not a separate engine. Each registered game owns its allowed settings, deterministic generation, and checker identity. Config remains JSON selecting registered games and settings; it contains no functions or Python templates. Only trusted application code generates executable scaffolding.\n\n```mermaid\nflowchart TB\n  codes[URL codes] --> controller[Round controller]\n  registry[Game registry] --> controller\n  controller --> game[Selected game definition]\n  game --> round[Generated Round]\n```\n```portable-canvas\ntitle: Select and generate\nkinds:\n  codes: data\n  controller: module\n  registry: module\n  game: definition\n  round: data\nlegend:\n  entries:\n    - kind: data\n    - kind: module\n    - kind: definition\n```\n```portable-nodes\ncodes:\n  component: card\n  title: Config Code + Round Code\n  body: Config selects game entries and settings. Round selects an entry and seed. Multiple entries may select the same game.\n  footer:\n    text: Existing microgame-config.ts; extend validation\ncontroller:\n  component: card\n  title: Round controller\n  body: Decode and validate codes. Resolve the selected registered game. Supply settings and seeded randomness. New round preserves the selected entry.\n  footer:\n    text: Proposed microgames/controller.ts; extracted from Microgames.astro\nregistry:\n  component: card\n  title: Game registry\n  body: Explicit allowlist of game IDs and their definitions. Shared lookup for generation and settings validation. No dynamic loading from a URL.\n  footer:\n    text: Proposed microgames/registry.ts\ngame:\n  component: card\n  title: Game definition\n  body: Category, allowed settings, generator, checker ID. One module per coherent skill family; variants share a definition when their generation and checks overlap.\n  footer:\n    text: Proposed microgames/games/dictionary.ts, classes.ts, datetime.ts, etc.\nround:\n  component: card\n  title: Generated Round\n  body: Prompt + fixed/input document segments + checker ID and JSON parameters. Each input has a stable ID, initial text and optional hint solution.\n  footer:\n    text: Proposed microgames/contracts.ts\n```\n\n## From a round to a working program\n\nThe adapter knows CodeMirror; game definitions do not. The protected-region extension knows document boundaries, not Python or game rules. The runner knows isolation and execution, not editor widgets.\n\n```mermaid\nflowchart TB\n  round[Generated Round] --> adapter[Document adapter]\n  adapter --> editor[Protected editor]\n  editor --> runner[Isolated Python runner]\n  round -->|checker ID and parameters| checker[Trusted checker]\n  runner -->|namespace and source| checker\n```\n```portable-canvas\ntitle: Edit, execute and check\nkinds:\n  round: data\n  adapter: module\n  editor: module\n  runner: module\n  checker: definition\nlegend:\n  entries:\n    - kind: data\n    - kind: module\n    - kind: definition\n```\n```portable-nodes\nround:\n  component: card\n  title: Generated Round\n  body: A portable description of what to show, where typing is allowed and which outcome to check.\n  footer:\n    text: Proposed microgames/contracts.ts\nadapter:\n  component: card\n  title: Document adapter\n  body: Concatenate segments; record input boundaries; place the cursor; bind per-input ghost hints; create fixed-line and inline decorations.\n  footer:\n    text: Proposed editor/round-document.ts\neditor:\n  component: card\n  title: Protected-region extension\n  body: Track editable ranges as text changes. Reject edits crossing fixed content. Keep empty inputs usable. Style fixed content with theme tokens. Preserve selection and copying.\n  footer:\n    text: Proposed editor/protected-regions.ts\nrunner:\n  component: card\n  title: Isolated Python runner\n  body: Execute the entire visible document. Keep network blocking, fresh runs, Stop and time/output limits. Remove hidden numbers injection.\n  footer:\n    text: Existing microgame-runner.ts; modify source handling\nchecker:\n  component: card\n  title: Checker dispatch\n  body: Resolve an allowlisted checker ID. Check resulting values, mutations or behavior; inspect syntax only when the task requires a particular construct. Hints are examples, not equality targets.\n  footer:\n    text: Existing public/microgame-checker.py; split trusted functions as it grows\n```\n\n## A concrete round\n\n```ts\n{\n  prompt: 'Assign age from profile, using 0 when the key is missing.',\n  document: [\n    { kind: 'fixed', text: 'profile = {\"name\": \"Maya\"}\\n\\nage = ' },\n    { kind: 'input', id: 'lookup', initial: '', solution: 'profile.get(\"age\", 0)' },\n    { kind: 'fixed', text: '\\n' }\n  ],\n  check: { id: 'dict.lookup', params: { variable: 'age', expected: 0 } }\n}\n```\n\nA whole-program round instead declares one empty input segment. An intermediate round supplies imports and a function signature, then leaves its body editable. These are document shapes, not three parallel engine systems. Progressively removing scaffolding prepares the user for a blank editor. This progression is a proposed way to compose rounds, not a new product mode or persistence feature.\n\nFor this lookup task, check the requested result and, if the task explicitly requires `.get`, the relevant syntax. A correct value alone cannot demonstrate general lookup behavior: stronger function-oriented rounds can call the user's function with both present and missing keys. Start with the appropriate check for each task rather than a universal template/equality checker.\n\n## Candidate game catalog\n\nAll are proposals. Categories organize browsing and files; individual operations are variants when they share a generator and checker.\n\n| Category | Small tasks / blanks | Later blank-editor task |\n|---|---|---|\n| Dictionaries | Lookup/default; assign/remove; iterate items; increment a count | Write a word-count function |\n| Lists and stacks | Index/slice; append/extend; pop; push/pop; replace an item | Write a function that maintains a small stack |\n| Sorting | Sort a copy/in place; reverse; key function; sort records by a field | Define a function sorting records by two fields |\n| Sets | Membership; add/discard; intersection/difference; deduplicate | Find shared IDs across two inputs |\n| Functions and calls | Define/return; positional/keyword arguments; default arguments; unpack arguments | Define and call a function with a default parameter |\n| Classes | Construct an instance; call a method; mutate an attribute; implement a method using self; dataclass defaults | Define a class and use two instances |\n| Strings | Split/join; strip; replace; f-string; case normalization | Parse a short delimited record |\n| Iteration | enumerate; zip; unpack pairs; accumulate; early return | Implement a short loop-based transformation |\n| Datetime | Construct a date; parse/format; add timedelta; subtract dates; compare dates; aware UTC datetime | Define a function calculating a due date |\n| Argparse | Add a positional/optional argument; type=int; store_true; read parsed attributes | Define a parser and parse supplied arguments |\n| JSON | loads/dumps; access nested data; transform decoded records | Decode input, transform it and encode output |\n| Exceptions | Raise ValueError; catch an expected exception; return a fallback | Validate input with a clear failure path |\n| Standard containers | Counter; defaultdict; deque append/popleft | Group records or consume a small queue |\n\nFor datetime, use explicit input dates and timezone-aware values where appropriate; avoid a moving 'today' in graded expectations. For argparse, call `parse_args([\"--count\", \"3\"])` rather than depending on browser process arguments. File-I/O exercises can come later using per-run virtual files; they are not needed to establish this foundation.\n\nThese are interview preparation candidates, not a claim about question frequency. Prioritize data structures, functions, object use and basic iteration; datetime and argparse expand practical Python fluency.\n\n## Proposed source layout\n\n```text\nweb/src/lib/\n  microgame-config.ts             # URL codec + top-level config validation (existing)\n  microgame-runner.ts             # isolated execution (existing)\n  microgames/\n    contracts.ts                 # GameDefinition, Round, Segment, CheckSpec\n    registry.ts                  # explicit game allowlist\n    controller.ts                # validated selection + deterministic generation\n    games/\n      classes.ts                 # existing class generator moves here\n      comprehensions.ts          # existing comprehension generator moves here\n      dictionary.ts              # lookup/update/count variants\n      lists.ts                   # indexing, mutation, stack variants\n      sorting.ts\n      functions.ts\n      datetime.ts\n      argparse.ts\n  editor/\n    protected-regions.ts          # generic CodeMirror boundary enforcement\n    round-document.ts            # round segments -> text/ranges/hints/decorations\nweb/public/\n  microgame-checker.py            # trusted checker dispatch + functions (existing)\nweb/src/components/\n  Microgames.astro                # page composition; existing controller logic extracted\n  MicrogameEngineConfig.astro     # existing configuration controls\n  MicrogameRound.astro            # existing round controls and prompt\n```\n\nOnly create game files as their games are implemented. Keep Python checkers together initially; split into self-hosted trusted assets only when needed, updating the runner asset allowlist at that time. Topic metadata does not need another runtime subsystem.\n\n## Smallest implementation sequence\n\n1. Add the segment contract, adapter and protected-region extension. Convert existing comprehensions to a fixed numbers definition plus an input; preserve class rounds as one whole-document input. Check boundary typing, paste/cut, empty inputs, multiline inputs, undo/redo and hints.\n2. Extract the existing generators into game modules and use one explicit registry for settings validation and generation. Introduce explicit checker dispatch: unknown IDs must fail rather than fall through to another checker.\n3. Add dictionary lookup and instance/method-call rounds to exercise inline blanks and multiple segments. Verify alternative valid answers and incorrect outcomes.\n4. Add sorting, datetime and argparse through the same contract. Add a second game-specific abstraction only when repeated implementations justify it.\n\nURL configs remain data selecting trusted capabilities. No local storage or user-supplied executable functions are needed for this scaffolding. Changing generated content later may require a URL/generator version policy to keep old Round Codes replayable; the current version/seed scheme does not freeze generator implementations.\n","html":"\u003ch1>Python microgames: one round contract, many small skills\u003c/h1>\n\u003cp>This is a design proposal, not implemented scaffolding. Today, two generators live in \u003ccode>web/src/lib/microgames.ts\u003c/code>; the editor/controller is in \u003ccode>Microgames.astro\u003c/code>, URL validation is in \u003ccode>microgame-config.ts\u003c/code>, and execution/checking use \u003ccode>microgame-runner.ts\u003c/code> and \u003ccode>public/microgame-checker.py\u003c/code>.\u003c/p>\n\u003cp>The organizing idea: \u003cstrong>a game definition generates a round; a round describes a document with fixed and editable segments; the editor renders that document; the runner executes its complete text and checks the outcome.\u003c/strong> A fill-in-the-blank and a blank-page exercise use the same document contract.\u003c/p>\n\u003ch2>From URL to a generated round\u003c/h2>\n\u003cp>A category is for organizing the catalog, not a separate engine. Each registered game owns its allowed settings, deterministic generation, and checker identity. Config remains JSON selecting registered games and settings; it contains no functions or Python templates. Only trusted application code generates executable scaffolding.\u003c/p>\n\u003cdiv data-portable-canvas=\"0\">\u003c/div>\u003ch2>From a round to a working program\u003c/h2>\n\u003cp>The adapter knows CodeMirror; game definitions do not. The protected-region extension knows document boundaries, not Python or game rules. The runner knows isolation and execution, not editor widgets.\u003c/p>\n\u003cdiv data-portable-canvas=\"1\">\u003c/div>\u003ch2>A concrete round\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">{\n  prompt: &#39;Assign age from profile, using 0 when the key is missing.&#39;,\n  document: [\n    { kind: &#39;fixed&#39;, text: &#39;profile = {&quot;name&quot;: &quot;Maya&quot;}\\n\\nage = &#39; },\n    { kind: &#39;input&#39;, id: &#39;lookup&#39;, initial: &#39;&#39;, solution: &#39;profile.get(&quot;age&quot;, 0)&#39; },\n    { kind: &#39;fixed&#39;, text: &#39;\\n&#39; }\n  ],\n  check: { id: &#39;dict.lookup&#39;, params: { variable: &#39;age&#39;, expected: 0 } }\n}\n\u003c/code>\u003c/pre>\n\u003cp>A whole-program round instead declares one empty input segment. An intermediate round supplies imports and a function signature, then leaves its body editable. These are document shapes, not three parallel engine systems. Progressively removing scaffolding prepares the user for a blank editor. This progression is a proposed way to compose rounds, not a new product mode or persistence feature.\u003c/p>\n\u003cp>For this lookup task, check the requested result and, if the task explicitly requires \u003ccode>.get\u003c/code>, the relevant syntax. A correct value alone cannot demonstrate general lookup behavior: stronger function-oriented rounds can call the user&#39;s function with both present and missing keys. Start with the appropriate check for each task rather than a universal template/equality checker.\u003c/p>\n\u003ch2>Candidate game catalog\u003c/h2>\n\u003cp>All are proposals. Categories organize browsing and files; individual operations are variants when they share a generator and checker.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Category\u003c/th>\n\u003cth>Small tasks / blanks\u003c/th>\n\u003cth>Later blank-editor task\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Dictionaries\u003c/td>\n\u003ctd>Lookup/default; assign/remove; iterate items; increment a count\u003c/td>\n\u003ctd>Write a word-count function\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lists and stacks\u003c/td>\n\u003ctd>Index/slice; append/extend; pop; push/pop; replace an item\u003c/td>\n\u003ctd>Write a function that maintains a small stack\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sorting\u003c/td>\n\u003ctd>Sort a copy/in place; reverse; key function; sort records by a field\u003c/td>\n\u003ctd>Define a function sorting records by two fields\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sets\u003c/td>\n\u003ctd>Membership; add/discard; intersection/difference; deduplicate\u003c/td>\n\u003ctd>Find shared IDs across two inputs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Functions and calls\u003c/td>\n\u003ctd>Define/return; positional/keyword arguments; default arguments; unpack arguments\u003c/td>\n\u003ctd>Define and call a function with a default parameter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Classes\u003c/td>\n\u003ctd>Construct an instance; call a method; mutate an attribute; implement a method using self; dataclass defaults\u003c/td>\n\u003ctd>Define a class and use two instances\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Strings\u003c/td>\n\u003ctd>Split/join; strip; replace; f-string; case normalization\u003c/td>\n\u003ctd>Parse a short delimited record\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Iteration\u003c/td>\n\u003ctd>enumerate; zip; unpack pairs; accumulate; early return\u003c/td>\n\u003ctd>Implement a short loop-based transformation\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Datetime\u003c/td>\n\u003ctd>Construct a date; parse/format; add timedelta; subtract dates; compare dates; aware UTC datetime\u003c/td>\n\u003ctd>Define a function calculating a due date\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Argparse\u003c/td>\n\u003ctd>Add a positional/optional argument; type=int; store_true; read parsed attributes\u003c/td>\n\u003ctd>Define a parser and parse supplied arguments\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JSON\u003c/td>\n\u003ctd>loads/dumps; access nested data; transform decoded records\u003c/td>\n\u003ctd>Decode input, transform it and encode output\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exceptions\u003c/td>\n\u003ctd>Raise ValueError; catch an expected exception; return a fallback\u003c/td>\n\u003ctd>Validate input with a clear failure path\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Standard containers\u003c/td>\n\u003ctd>Counter; defaultdict; deque append/popleft\u003c/td>\n\u003ctd>Group records or consume a small queue\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>For datetime, use explicit input dates and timezone-aware values where appropriate; avoid a moving &#39;today&#39; in graded expectations. For argparse, call \u003ccode>parse_args([&quot;--count&quot;, &quot;3&quot;])\u003c/code> rather than depending on browser process arguments. File-I/O exercises can come later using per-run virtual files; they are not needed to establish this foundation.\u003c/p>\n\u003cp>These are interview preparation candidates, not a claim about question frequency. Prioritize data structures, functions, object use and basic iteration; datetime and argparse expand practical Python fluency.\u003c/p>\n\u003ch2>Proposed source layout\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">web/src/lib/\n  microgame-config.ts             # URL codec + top-level config validation (existing)\n  microgame-runner.ts             # isolated execution (existing)\n  microgames/\n    contracts.ts                 # GameDefinition, Round, Segment, CheckSpec\n    registry.ts                  # explicit game allowlist\n    controller.ts                # validated selection + deterministic generation\n    games/\n      classes.ts                 # existing class generator moves here\n      comprehensions.ts          # existing comprehension generator moves here\n      dictionary.ts              # lookup/update/count variants\n      lists.ts                   # indexing, mutation, stack variants\n      sorting.ts\n      functions.ts\n      datetime.ts\n      argparse.ts\n  editor/\n    protected-regions.ts          # generic CodeMirror boundary enforcement\n    round-document.ts            # round segments -&gt; text/ranges/hints/decorations\nweb/public/\n  microgame-checker.py            # trusted checker dispatch + functions (existing)\nweb/src/components/\n  Microgames.astro                # page composition; existing controller logic extracted\n  MicrogameEngineConfig.astro     # existing configuration controls\n  MicrogameRound.astro            # existing round controls and prompt\n\u003c/code>\u003c/pre>\n\u003cp>Only create game files as their games are implemented. Keep Python checkers together initially; split into self-hosted trusted assets only when needed, updating the runner asset allowlist at that time. Topic metadata does not need another runtime subsystem.\u003c/p>\n\u003ch2>Smallest implementation sequence\u003c/h2>\n\u003col>\n\u003cli>Add the segment contract, adapter and protected-region extension. Convert existing comprehensions to a fixed numbers definition plus an input; preserve class rounds as one whole-document input. Check boundary typing, paste/cut, empty inputs, multiline inputs, undo/redo and hints.\u003c/li>\n\u003cli>Extract the existing generators into game modules and use one explicit registry for settings validation and generation. Introduce explicit checker dispatch: unknown IDs must fail rather than fall through to another checker.\u003c/li>\n\u003cli>Add dictionary lookup and instance/method-call rounds to exercise inline blanks and multiple segments. Verify alternative valid answers and incorrect outcomes.\u003c/li>\n\u003cli>Add sorting, datetime and argparse through the same contract. Add a second game-specific abstraction only when repeated implementations justify it.\u003c/li>\n\u003c/ol>\n\u003cp>URL configs remain data selecting trusted capabilities. No local storage or user-supplied executable functions are needed for this scaffolding. Changing generated content later may require a URL/generator version policy to keep old Round Codes replayable; the current version/seed scheme does not freeze generator implementations.\u003c/p>\n","schemaBlocks":[],"diagrams":[{"id":"canvas-1","graph":{"nodes":[{"id":"codes","label":"URL codes","group":false,"classes":["data"],"card":{"component":"card","title":"Config Code + Round Code","body":"Config selects game entries and settings. Round selects an entry and seed. Multiple entries may select the same game.","footer":{"text":"Existing microgame-config.ts; extend validation"}},"kind":"data"},{"id":"controller","label":"Round controller","group":false,"classes":["module"],"card":{"component":"card","title":"Round controller","body":"Decode and validate codes. Resolve the selected registered game. Supply settings and seeded randomness. New round preserves the selected entry.","footer":{"text":"Proposed microgames/controller.ts; extracted from Microgames.astro"}},"kind":"module"},{"id":"registry","label":"Game registry","group":false,"classes":["module"],"card":{"component":"card","title":"Game registry","body":"Explicit allowlist of game IDs and their definitions. Shared lookup for generation and settings validation. No dynamic loading from a URL.","footer":{"text":"Proposed microgames/registry.ts"}},"kind":"module"},{"id":"game","label":"Selected game definition","group":false,"classes":["definition"],"card":{"component":"card","title":"Game definition","body":"Category, allowed settings, generator, checker ID. One module per coherent skill family; variants share a definition when their generation and checks overlap.","footer":{"text":"Proposed microgames/games/dictionary.ts, classes.ts, datetime.ts, etc."}},"kind":"definition"},{"id":"round","label":"Generated Round","group":false,"classes":["data"],"card":{"component":"card","title":"Generated Round","body":"Prompt + fixed/input document segments + checker ID and JSON parameters. Each input has a stable ID, initial text and optional hint solution.","footer":{"text":"Proposed microgames/contracts.ts"}},"kind":"data"}],"edges":[{"id":"L_codes_controller_0","
